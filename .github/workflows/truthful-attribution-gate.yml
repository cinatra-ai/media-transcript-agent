name: truthful-attribution-gate

# Thin caller for the org-reusable truthful-attribution-gate (cinatra-ai/ci),
# per ratified spec cinatra-engineering#119. WARN mode (eng#119 rollout):
# findings are annotated, the check is ALWAYS green -- it never fails a PR, and
# it is NOT a required status check here (it stays advisory only). No
# .github/gate-suite.json is committed (WARN scope exercises presence + the
# human arm; the gate-suite arm is not exercised without a committed suite).
#
# Pinned to the immutable engine SHA proven green in cinatra ENFORCE today
# (ci main HEAD = 8eede102), which is one commit ahead of the latest ci tag.
# The trailing version comment on the `uses:` line below is the nearest ci tag
# plus the actual pinned SHA as semver build metadata: the repo's
# actions-pinned-gate requires a `# vX.Y.Z` comment, and this form satisfies it
# without claiming the SHA is exactly that tag (it is not).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  checks: read
  # actions:read is MANDATORY: the engine at the pinned SHA resolves a
  # reusable-workflow check-run to its Actions run (GET /actions/runs/{id}) to
  # verify referenced_workflows[] at the pinned SHA. With an explicit
  # permissions block, any omitted scope defaults to `none`, and a called
  # reusable workflow cannot exceed the caller's grant -- so omitting this
  # causes startup_failure (red/missing check), which WARN mode CANNOT rescue
  # (it fails before any step runs). Do not drop this line.
  actions: read

jobs:
  truthful-attribution-gate:                 # caller job id MUST stay this exact string
    uses: cinatra-ai/ci/.github/workflows/truthful-attribution-gate.yml@8eede1022e835997d94974e4bd6205daf72131a2 # v0.1.0+8eede102
    with:
      mode: warn
      ref: 8eede1022e835997d94974e4bd6205daf72131a2
